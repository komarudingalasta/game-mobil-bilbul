<!DOCTYPE html>
<html lang="id">

<head>

<meta charset="UTF-8">

<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Math Racing - Materi</title>

<link rel="stylesheet" href="css/materi.css">

<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;600;700;800&display=swap" rel="stylesheet">

</head>


<body>


<div class="container">


    <div class="title">

        <h1>📚 PILIH MATERI</h1>

        <p>
            Pilih tantangan matematika
        </p>

    </div>



    <div class="materi-list">


        <button onclick="pilihMateri('penjumlahan')">

            ➕ Penjumlahan Bilangan Bulat

        </button>



        <button onclick="pilihMateri('pengurangan')">

            ➖ Pengurangan Bilangan Bulat

        </button>



        <button onclick="pilihMateri('perkalian')">

            ✖ Perkalian Bilangan Bulat

        </button>



        <button onclick="pilihMateri('pembagian')">

            ➗ Pembagian Bilangan Bulat

        </button>



        <button onclick="pilihMateri('campuran')">

            🔢 Operasi Hitung Campuran

        </button>


    </div>



    <button class="back"
    onclick="kembali()">

        ⬅ Kembali

    </button>



</div>



<script>


function pilihMateri(materi){


    localStorage.setItem(
        "materi",
        materi
    );


    window.location.href =
    "level.html";


}



function kembali(){


    window.location.href =
    "menu.html";


}


</script>


</body>

</html>
